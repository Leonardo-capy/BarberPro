<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Geral - BarberPro</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <header class="navbar navbar-admin">
        <div class="logo">👑 BarberPro Admin</div>
        <nav class="admin-nav">
            <a href="/index.html">Painel Cliente</a>
            <a href="/admin.html">Agendamentos</a>
            <a href="/admin-bloqueios.html">Bloqueios</a>
            <a href="/admin-total.html" class="active">Painel Total</a>
            <a href="/logout">Sair</a>
        </nav>
    </header>

    <main class="admin-layout">

        <!-- LADO ESQUERDO -->
        <div class="lado-esquerdo">

            <section class="dashboard">

                <div class="stat-card">
                    <h3>Total de Agendamentos</h3>
                    <p id="totalAgendamentos">0</p>
                </div>

                <div class="stat-card">
                    <h3>Faturamento Total</h3>
                    <p id="faturamentoTotal">R$ 0,00</p>
                </div>

                <div class="stat-card">
                    <h3>Total de Clientes</h3>
                    <p id="totalClientes">0</p>
                </div>

                <div class="stat-card">
                    <h3>Barbeiro Top</h3>
                    <p id="barbeiroTop">-</p>
                </div>

                <div class="stat-card">
                    <h3>Serviço Mais Vendido</h3>
                    <p id="servicoTop">-</p>
                </div>

            </section>

            <section class="table-container">
                <h2>Gerenciar Usuários</h2>

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Usuário</th>
                            <th>Role</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaUsuarios"></tbody>
                </table>
            </section>

        </div>

        <!-- LADO DIREITO -->
        <div class="lado-direito">

            <section class="servicos-admin">
                <h2>Adicionar Novo Usuário</h2>

                <form id="formNovoUsuario" class="form-servico">
                    <input type="text" id="novoUsuario" placeholder="Usuário" required>
                    <input type="password" id="novaSenha" placeholder="Senha" required>

                    <select id="novaRole">
                        <option value="barbeiro">Barbeiro</option>
                        <option value="admin">Admin</option>
                    </select>

                    <button type="submit">Adicionar</button>
                </form>
            </section>

        </div>

    </main>

    <script src="/script-dashboard.js"></script>

    <script>
        async function carregarDashboard() {
            const res = await fetch("/api/admin/dashboard");

            if (!res.ok) {
                alert("Acesso negado.");
                window.location.href = "/admin.html";
                return;
            }

            const data = await res.json();

            document.getElementById("totalAgendamentos").textContent =
                data.totalAgendamentos;

            document.getElementById("faturamentoTotal").textContent =
                "R$ " + Number(data.faturamentoTotal).toFixed(2);

            document.getElementById("totalClientes").textContent =
                data.totalClientes;

            document.getElementById("barbeiroTop").textContent =
                data.barbeiroTop
                    ? data.barbeiroTop.usuario + " (R$ " + Number(data.barbeiroTop.total).toFixed(2) + ")"
                    : "Nenhum";

            document.getElementById("servicoTop").textContent =
                data.servicoTop
                    ? data.servicoTop.servico + " (" + data.servicoTop.total + " vendas)"
                    : "Nenhum";
        }

        carregarDashboard();
    </script>

</body>

</html>
