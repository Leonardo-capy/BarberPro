<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Painel Administrativo - BarberPro</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="navbar">
    <div class="logo">✂ BarberPro Admin</div>
    <nav class="admin-nav">
      <a href="admin.html" class="active">Agendamentos</a>
      <a href="admin-bloqueios.html">Bloqueios</a>
    </nav>
  </header>

  
  <button id="btnAdminTotal" style="display:none;" onclick="window.location.href='/admin-total.html'">Painel Total</button>


  <main class="admin-layout">

    <div class="lado-esquerdo">

      <!-- Estatísticas -->
      <section class="dashboard">
        <div class="stat-card">
          <h3>Total de Agendamentos</h3>
          <p id="total">0</p>
        </div>

        <div class="stat-card">
          <h3>Hoje</h3>
          <p id="hoje">0</p>
        </div>

        <div class="stat-card">
          <h3>Faturamento Total</h3>
          <p id="faturamento">R$ 0,00</p>
        </div>
      </section>

      <!-- Lista -->
      <section class="table-container">
        <h2>Lista de Agendamentos</h2>
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Telefone</th>
              <th>Serviço</th>
              <th>Data</th>
              <th>Horário</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="lista"></tbody>
        </table>
      </section>

    </div>

    <div class="lado-direito">
      <section class="servicos-admin">
        <h2>Gerenciar Serviços</h2>

        <form id="formServico" class="form-servico">
          <input type="text" id="nomeServico" placeholder="Nome do serviço" required>
          <input type="number" id="precoServico" placeholder="Preço (R$)" step="0.01" required>
          <button type="submit">Adicionar Serviço</button>
        </form>

        <ul id="listaServicos"></ul>
      </section>
    </div>

  </main>


  <script src="script-dashboard.js"></script>
</body>

</html>
